upstream app {
	server 127.0.0.1:8080;
	keepalive 16;
	keepalive_requests 100000;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  root /home/isucon/webapp/public;

  # 事前生成した初期画像。initialize では削除しない。
  location /_preset_images/ {
    internal;
    alias /home/isucon/webapp/preset-images/;
    default_type application/octet-stream;
  }

  # Go が X-Accel-Redirect で指定する実行時キャッシュ。initialize で削除する。
  location /_internal_images/ {
    internal;
    alias /home/isucon/webapp/cache/images/;
    default_type application/octet-stream;
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_pass http://app;
  }

  location / {
    add_header Cache-Control "public; max-age=60s";
    try_files $uri /index.html;
  }
}
