# isureal nginx site config
#
# 適用:
#   sudo cp /home/isucon/isureal.conf /etc/nginx/sites-available/isureal.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx.conf 側で別途設定するもの:
#   worker_processes auto;
#   worker_rlimit_nofile 65535;
#   events { worker_connections 4096; multi_accept on; use epoll; }
#   http {
#       keepalive_timeout 30s;
#       keepalive_requests 10000;
#       server_tokens off;
#       access_log /var/log/nginx/access.log time buffer=64k flush=1s;
#   }

upstream app {
    server 127.0.0.1:8080;
    keepalive 64;
    keepalive_requests 100000;
}

server {
    listen 80 default_server reuseport backlog=4096;
    server_name _;

    client_max_body_size 32m;
    client_body_buffer_size 1m;
    root /home/isucon/webapp/public;

    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    # SSE: 即時flushし、60秒のproxy_read_timeoutで切られないようにする。
    # Go側は500msごとにDBポーリングしているため、タイムアウトを伸ばしすぎる場合はDB負荷に注意。
    location = /api/notifications {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_pass http://app;

        proxy_connect_timeout 5s;
        proxy_socket_keepalive on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
    }

    # 大きなZIP exportは一時ファイルに落とさずストリームする。
    location = /api/me/export {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_pass http://app;

        proxy_connect_timeout 5s;
        proxy_socket_keepalive on;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_pass http://app;

        proxy_connect_timeout 5s;
        proxy_socket_keepalive on;

        # アップロードをnginx側で一度ディスクに書き出さない。
        proxy_request_buffering off;

        # p95 353KB / p99 641KB 程度のJSONを一時ファイルに落としにくくする。
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }

    # 事前生成した初期画像。initialize では削除しない。
    location /_preset_images/ {
        internal;
        alias /home/isucon/webapp/preset-images/;
        default_type application/octet-stream;
        aio threads;
    }

    # Go が X-Accel-Redirect で指定する実行時キャッシュ。initialize で削除する。
    location /_internal_images/ {
        internal;
        alias /home/isucon/webapp/cache/images/;
        default_type application/octet-stream;
        aio threads;
    }

    # Viteのハッシュ付きassetsは長期キャッシュ。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.htmlは更新を拾えるようにno-cache。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
