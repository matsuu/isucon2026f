# ISUReal benchmark tuning: durability is intentionally reduced.
fsync = off
synchronous_commit = off
full_page_writes = off

# No replicas / replication slots are used.
wal_level = minimal
max_wal_senders = 0
max_replication_slots = 0
archive_mode = off

# Fewer checkpoints, larger WAL.
checkpoint_timeout = 30min
max_wal_size = 8GB
min_wal_size = 1GB
wal_buffers = 64MB

# Background writer.
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 4.0

# Memory and planner for the 2 vCPU / 3.7GB DB server.
shared_buffers = 1GB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB
random_page_cost = 1.1
effective_io_concurrency = 200
jit = off
